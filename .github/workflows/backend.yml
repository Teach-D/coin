name: Backend CI/CD

on:
  push:
    branches:
      - '**'
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/backend.yml"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/coin-battle-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Build
        working-directory: backend
        run: npm run build

      - name: Test
        working-directory: backend
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          source: docker-compose.prod.yml
          target: ~/coinbattle

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,ENV_PROD
          script: |
            echo "$ENV_PROD" > ~/coinbattle/.env.prod
            cd ~/coinbattle
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d postgres redis

            docker compose --env-file .env.prod -f docker-compose.prod.yml pull backend
            docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm backend \
              node node_modules/.bin/typeorm migration:run -d dist/src/common/config/database.config.js
            docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --no-deps --force-recreate backend

            echo "Waiting for backend to become healthy..."
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' coinbattle-backend 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                echo "Backend is healthy."
                break
              fi
              if [ "$i" = "12" ]; then
                echo "Backend did not become healthy within 2 minutes."
                docker logs coinbattle-backend --tail 50
                exit 1
              fi
              echo "Attempt $i/12: status=$STATUS, retrying in 10s..."
              sleep 10
            done

            docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
